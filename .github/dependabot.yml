# Dependabot (Claude, 2026-10-19).
# - npm: security fixes only, grouped into one PR. `open-pull-requests-limit: 0` turns off routine version-bump PRs
#   without affecting security updates. Big upgrades (Next, wagmi, viem) stay deliberate, done by an agent in a PR.
# - GitHub Actions: the CI actions are pinned to commit SHAs; this keeps those pins current, one grouped PR a month.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
