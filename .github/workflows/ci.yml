name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test:all
      - name: .env.example holds names only
        run: |
          if grep -vE '^\s*(#.*)?$' .env.example | grep -vE '^[A-Z0-9_]+=$'; then
            echo "::error::.env.example must contain NAME= lines only, never values"; exit 1
          fi
